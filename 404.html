<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Dana Issa</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }

      .error-content {
        max-width: 600px;
      }

      .error-code {
        font-size: clamp(6rem, 15vw, 10rem);
        font-weight: 700;
        margin-bottom: 20px;
        background: linear-gradient(to right, #fff, #f0f0f0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .error-message {
        font-size: clamp(1.5rem, 4vw, 2rem);
        margin-bottom: 20px;
      }

      .error-description {
        font-size: 1.125rem;
        margin-bottom: 40px;
        opacity: 0.9;
      }

      .error-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 32px;
        background: white;
        color: #6366f1;
        text-decoration: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }

      .error-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div class="error-content">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Oops! Page Not Found</h2>
        <p class="error-description">
          The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="/" class="error-button">
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M10 20C4.477 20 0 15.523 0 10S4.477 0 10 0s10 4.477 10 10-4.477 10-10 10zm0-2a8 8 0 100-16 8 8 0 000 16zm-1-5v2H7v-2h2zm2 0a3 3 0 00-3-3V8a5 5 0 015 5h-2z"
              fill="currentColor"
            />
          </svg>
          Back to Home
        </a>
      </div>
    </div>
  </body>
</html>
